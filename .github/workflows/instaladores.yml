# Compila los instaladores de Dermap para Windows y macOS en GitHub (sin instalar nada en local).
#
# Se lanza a mano desde la pestaña «Actions» (Instaladores → Run workflow) o al subir una
# etiqueta de versión (git tag v0.2.0 && git push --tags). Los instaladores quedan como
# artefactos descargables de la ejecución; con una etiqueta, además, en un borrador de release.
#
# Los instaladores no están firmados: Windows mostrará SmartScreen («Más información →
# Ejecutar de todas formas») y macOS pedirá abrirlo con clic derecho → Abrir la primera vez.
name: Instaladores

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  compilar:
    strategy:
      fail-fast: false
      matrix:
        include:
          - nombre: windows
            sistema: windows-latest
            args: ""
            artefactos: |
              src-tauri/target/release/bundle/msi/*.msi
              src-tauri/target/release/bundle/nsis/*.exe
          - nombre: macos
            sistema: macos-latest
            args: "--target universal-apple-darwin"
            artefactos: |
              src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.sistema }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.nombre == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - name: Pruebas
        run: npm test

      - name: Compilar instalador
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && format('Dermap {0}', github.ref_name) || '' }}
          releaseDraft: true

      - uses: actions/upload-artifact@v4
        with:
          name: dermap-${{ matrix.nombre }}
          path: ${{ matrix.artefactos }}
          if-no-files-found: error
